<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Cuisine</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css?v=44.002">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-row">
                <h1>Ma Cuisine <span class="version">v44.003</span> <span id="sync-status" class="sync-status" title="État de la synchronisation"></span></h1>
                <button type="button" id="shopping-list-btn" class="btn btn-primary shopping-list-btn" title="Liste de courses (repas affichés)">
                    <span class="shopping-list-label">Liste de courses</span>
                    <svg class="shopping-list-icon" width="20" height="20" viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="18" y="14" width="28" height="38" rx="4" fill="none" stroke="currentColor" stroke-width="5"/>
                        <path d="M 24 26 l3 3 l5 -5 M 24 40 l3 3 l5 -5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 37 25 h6 M 37 39 h6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="main-layout">
            <!-- Colonne Menu -->
            <nav class="mobile-tabs" id="mobile-tabs">
                <button type="button" class="mobile-tab active" data-tab="menu">Menu</button>
                <button type="button" class="mobile-tab" data-tab="recipes">Recettes</button>
            </nav>
            <section class="menu-section" id="menu-section" data-section="menu">
                <div class="days-list" id="days-list">
                    <!-- Les jours seront générés dynamiquement -->
                </div>
            </section>

            <!-- Colonne Recettes -->
            <section class="recipes-section" id="recipes-section" data-section="recipes">
                <div class="recipes-header">
                    <h2>Mes Recettes</h2>
                    <button id="export-recipes-btn" class="btn btn-secondary" title="Télécharger mes recettes en fichier texte">
                        Exporter
                    </button>
                    <button id="import-recipes-btn" class="btn btn-secondary" title="Importer des recettes depuis un fichier texte d'export">
                        Importer
                    </button>
                    <input type="file" id="import-recipes-input" accept=".txt,text/plain" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;">
                    <div class="header-spacer"></div>
                    <button id="add-recipe-btn" class="btn btn-primary">
                        <span>+</span> Ajouter
                    </button>
                </div>
                
                <div class="search-bar">
                    <input type="text" id="recipe-search" placeholder="Rechercher...">
                </div>

                <div id="recipes-list" class="recipes-grid">
                    <!-- Les recettes seront ajoutées ici -->
                </div>
            </section>
        </div>
    </div>

    <!-- Modal pour ajouter/modifier une recette -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="modal-title">Ajouter une recette</h2>
                <button class="btn-close">&times;</button>
            </div>
            <form id="recipe-form">
                <div class="form-group">
                    <label for="recipe-name">Nom de la recette *</label>
                    <input type="text" id="recipe-name" required>
                </div>
                <div class="form-group">
                    <div class="url-label-row">
                        <label for="recipe-url">URL</label>
                        <span class="modified-inline"><input type="checkbox" id="recipe-modified"> <label for="recipe-modified">Recette modifiée</label></span>
                    </div>
                    <input type="url" id="recipe-url" placeholder="https://...">
                </div>
                <div class="form-group">
                    <div class="ingredients-label-row">
                        <label for="recipe-ingredients">Ingrédients <span class="hint">— un par ligne, quantité d'abord</span></label>
                        <span class="servings-inline">pour <input type="text" id="recipe-servings" size="3" maxlength="3" placeholder="X" aria-label="Nombre de personnes"> personnes</span>
                    </div>
                    <textarea id="recipe-ingredients" rows="5" placeholder="200 g de farine&#10;3 œufs&#10;20 cl de crème..."></textarea>
                </div>
                <div class="form-group">
                    <label for="recipe-steps">Recette <span class="hint">— les étapes, un paragraphe par étape</span></label>
                    <textarea id="recipe-steps" rows="6" placeholder="Étape 1 : ...&#10;&#10;Étape 2 : ..."></textarea>
                </div>
                <div class="form-group">
                    <label for="recipe-text">Notes</label>
                    <textarea id="recipe-text" rows="5" placeholder="Notes, astuces..."></textarea>
                </div>
                <div class="form-group">
                    <label for="recipe-image-url">Image</label>
                    <input type="url" id="recipe-image-url" placeholder="https://... (adresse de l'image)">
                </div>
                <div class="form-group">
                    <label for="recipe-category">Catégorie</label>
                    <input type="text" id="recipe-category" placeholder="Ex: Plat principal, Dessert, Entrée...">
                </div>
                <div class="form-group">
                    <label for="recipe-tags">Tags (séparés par des virgules)</label>
                    <input type="text" id="recipe-tags" placeholder="Ex: végétarien, rapide...">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-btn">Annuler</button>
                    <button type="submit" class="btn btn-primary" id="save-btn">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal pour voir une recette -->
    <div id="view-recipe-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2 id="view-recipe-title"></h2>
                <img id="view-recipe-image" class="recipe-detail-image" style="display:none;" alt="">
            </div>
            <div id="view-recipe-content">
                <div id="view-recipe-category" class="recipe-meta"></div>
                <div id="view-recipe-tags" class="recipe-meta"></div>
                <div id="view-recipe-url" class="recipe-url"></div>
                <div id="view-recipe-ingredients"></div>
                <div id="view-recipe-steps"></div>
                <div id="view-recipe-text" class="recipe-text"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary btn-edit-from-view" id="edit-from-view-btn">Modifier</button>
                <button class="btn btn-secondary btn-close-view">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modal liste de courses -->
    <div id="shopping-list-modal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2>Liste de courses</h2>
                <button class="btn-close">&times;</button>
            </div>
            <div id="shopping-list-content" class="shopping-list-content"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="shopping-list-copy-btn">Copier</button>
                <button type="button" class="btn btn-secondary" id="shopping-list-close-btn">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Indicateur de drag (invisible par défaut) -->
    <div id="drag-indicator" class="drag-indicator">Glissez ici pour assigner</div>

    <script src="script.js?v=44.002"></script>
</body>
</html>
